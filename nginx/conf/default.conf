server {
    listen 80;
    server_name apiversus.servehttp.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server{
	listen 443 ssl;
	server_name apiversus.servehttp.com;
	
	ssl_certificate /etc/letsencrypt/live/apiversus.servehttp.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/apiversus.servehttp.com/privkey.pem;

	location / {
		proxy_pass http://api:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}
}
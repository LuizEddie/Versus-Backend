services:
    api:
        image: ghcr.io/luizeddie/versus-backend:latest
        # build: .
        container_name: versus-api
        expose:
            - "8080"
        env_file:
            - .env
        restart: always
        volumes:
            - uploads_data:/app/wwwroot/uploads
    
    nginx:
        image: nginx:latest
        container_name: nginx
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/conf:/etc/nginx/conf.d
            - ./certbot/www:/var/www/certbot
            - ./certbot/conf:/etc/letsencrypt
        depends_on:
            - api
        restart: always
    
    certbot:
        image: certbot/certbot
        volumes:
            - ./certbot/www:/var/www/certbot
            - ./certbot/conf:/etc/letsencrypt

volumes:
  uploads_data: